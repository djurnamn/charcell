<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Expressibility Compare</title>
    <!--
  Generated by build-compare.tsx from compare.template.html; edit the
  template, then `pnpm text:build`.

  Each charcell component beside the text a character-cell screen would print
  for it, in the same face and cell. "difference" stacks the two and blends
  them: identical cells cancel to black, and what the CSS draws that no cell
  could shows up lit. check.mjs scores the same comparison cell by cell.
-->
    <style>
      /* charcell.full.css */
    </style>
    <style>
      :root {
        --chrome: color-mix(
          in srgb,
          var(--charcell-foreground) 8%,
          var(--charcell-background)
        );
      }
      body {
        margin: 0;
        font:
          13px/1.4 ui-monospace,
          Menlo,
          monospace;
      }
      .controls {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 10px 16px;
        background: var(--chrome);
        border-bottom: 1px solid var(--charcell-faint);
        color: var(--charcell-mid);
      }
      .controls label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .controls select,
      .controls button {
        font: inherit;
        color: var(--charcell-foreground);
        background: var(--charcell-background);
        border: 1px solid var(--charcell-mid);
        padding: 2px 6px;
      }
      .cases {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 28px 40px;
        padding: 20px 16px 60px;
      }
      .case {
        margin: 0;
      }
      .case figcaption {
        color: var(--charcell-mid);
        margin-bottom: 8px;
      }
      /* The text starts a whole number of cells after the component, so both sit
     at the same fraction of a pixel and rasterize alike. */
      .case__view {
        display: grid;
        grid-template-columns: calc((var(--columns) + 4) * 1ch) max-content;
        align-items: start;
        font-size: var(--charcell-font-size);
        font-family: var(--charcell-font-family);
      }
      .case__css,
      .case__text {
        position: relative;
      }
      /* An inline component would sit on the page's own line box; as a grid item
     it starts at the top, where the text does. */
      .case__css {
        display: grid;
        justify-items: start;
        align-items: start;
      }
      [data-view="difference"] .case__view {
        grid-template-columns: max-content;
      }
      [data-view="difference"] .case__css,
      [data-view="difference"] .case__text {
        grid-area: 1 / 1;
      }
      [data-view="difference"] .case__text {
        mix-blend-mode: difference;
      }
      [data-view="css"] .case__text,
      [data-view="text"] .case__css {
        display: none;
      }
      /* cells.css */
    </style>
    <script src="cases.cjs"></script>
  </head>
  <body>
    <div class="controls">
      <label
        >font
        <select id="font"></select
      ></label>
      <label
        >view
        <select id="view">
          <option value="side">side by side</option>
          <option value="difference">difference</option>
          <option value="css">css only</option>
          <option value="text">text only</option>
        </select>
      </label>
      <label
        >mode
        <select id="mode">
          <option>dark</option>
          <option>light</option>
        </select></label
      >
      <span id="status"></span>
    </div>
    <main class="cases" id="cases"></main>
    <script>
      /* cases */
      const { CASES, FAMILIES, render, strip, range, BOX, BLOCKS, EXTRA } =
        window.CharcellText;

      // ── the cases ───────────────────────────────────────────────────────────────
      const main = document.getElementById("cases");
      for (const [id, [name, lines]] of Object.entries(CASES)) {
        const figure = document.createElement("figure");
        figure.className = "case";
        figure.dataset.case = id;
        const caption = document.createElement("figcaption");
        caption.textContent = name;
        const view = document.createElement("div");
        view.className = "case__view";
        const css = document.createElement("div");
        css.className = "case__css";
        css.innerHTML = MARKUP[id];
        const text = document.createElement("pre");
        text.className = "case__text charcell-text";
        text.append(render(lines.join("\n")));
        view.style.setProperty(
          "--columns",
          Math.max(...lines.map((line) => strip(line).length)),
        );
        view.append(css, text);
        figure.append(caption, view);
        main.append(figure);
      }

      // ── font, view, mode ────────────────────────────────────────────────────────
      const KIT = "charcell";
      const params = new URLSearchParams(location.search);
      const font = document.getElementById("font");
      font.append(new Option("charcell (its own Overpass Mono, 8 x 16)", KIT));
      for (const [family] of FAMILIES) font.append(new Option(family, family));
      const view = document.getElementById("view");
      const mode = document.getElementById("mode");
      const recall = (key, fallback) => {
        try {
          return localStorage.getItem("compare:" + key) ?? fallback;
        } catch {
          return fallback;
        }
      };
      const remember = (key, value) => {
        try {
          localStorage.setItem("compare:" + key, value);
        } catch {}
      };
      font.value = params.get("font") ?? recall("font", KIT);
      view.value = params.get("view") ?? recall("view", "side");
      mode.value = params.get("mode") ?? recall("mode", "dark");

      const characters = () =>
        [
          ...new Set(
            range(0x20, 0x7e) +
              BOX +
              BLOCKS +
              EXTRA +
              Object.values(CASES)
                .map(([, lines]) => strip(lines.join("")))
                .join("") +
              document.getElementById("cases").textContent,
          ),
        ].join("");
      const loaded = new Map();
      function load(family) {
        if (!loaded.has(family)) {
          const weights = FAMILIES.find(([name]) => name === family)?.[1] ?? [
            400, 700,
          ];
          const link = document.createElement("link");
          link.rel = "stylesheet";
          const axis = weights.length > 1 ? `:wght@${weights.join(";")}` : "";
          link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(family).replace(/%20/g, "+")}${axis}&text=${encodeURIComponent(characters())}&display=block`;
          document.head.append(link);
          loaded.set(
            family,
            new Promise((resolve) => {
              link.onload = () =>
                document.fonts
                  .load(`16px "${family}"`, characters())
                  .then(resolve, resolve);
              link.onerror = resolve;
            }),
          );
        }
        return loaded.get(family);
      }

      async function apply() {
        const root = document.documentElement;
        // Dark is the default, which takes no attribute.
        if (mode.value === "light") root.dataset.charcellMode = "light";
        else delete root.dataset.charcellMode;
        document.body.dataset.view = view.value;
        remember("font", font.value);
        remember("view", view.value);
        remember("mode", mode.value);
        const status = document.getElementById("status");
        if (font.value === KIT) {
          root.style.removeProperty("--charcell-font-family");
          await document.fonts.ready;
        } else {
          status.textContent = "loading...";
          await load(font.value);
          root.style.setProperty(
            "--charcell-font-family",
            `"${font.value}", monospace`,
          );
        }
        await document.fonts.ready;
        // The captions set in the page's own face are fractions of a pixel wide and
        // tall, which would put the cases after them between pixels, where the
        // face's glyphs and the drawn cells rasterize apart: each case is rounded
        // up to whole pixels, so every one starts on a pixel.
        for (const figure of document.querySelectorAll(".case")) {
          figure.style.width = figure.style.height = "";
          const box = figure.getBoundingClientRect();
          figure.style.width = `${Math.ceil(box.width)}px`;
          figure.style.height = `${Math.ceil(box.height)}px`;
        }
        status.textContent = "";
      }
      for (const control of [font, view, mode])
        control.addEventListener("input", apply);
      window.compareReady = apply();
    </script>
  </body>
</html>
